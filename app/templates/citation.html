{% extends "base.html" %}
{% block contenu %}
<section class="carte">
  <h1>💬 Une citation</h1>
  <form method="post" action="/citation" class="formulaire">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="citation">La citation</label>
    <textarea id="citation" name="citation" rows="4" required maxlength="1000">{{ valeurs.citation if valeurs else '' }}</textarea>
    <label for="personne">Qui l'a dite ?</label>
    <input id="personne" name="personne" type="text" required maxlength="60" value="{{ valeurs.personne if valeurs else '' }}">
    <label for="contexte">Contexte <span class="optionnel">(optionnel)</span></label>
    <textarea id="contexte" name="contexte" rows="3" maxlength="500">{{ valeurs.contexte if valeurs else '' }}</textarea>
    <button type="submit" class="bouton">Envoyer</button>
  </form>
  <p class="petit"><a href="/">← Retour</a></p>
</section>
{% endblock %}
