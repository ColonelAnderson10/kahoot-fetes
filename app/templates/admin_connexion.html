{% extends "base.html" %}
{% block titre %}Admin · Kahoot des fêtes{% endblock %}
{% block contenu %}
<section class="carte">
  <h1>Administration</h1>
  <form method="post" action="/admin/connexion" class="formulaire">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="mot_de_passe">Mot de passe admin</label>
    <input id="mot_de_passe" name="mot_de_passe" type="password" required autocomplete="current-password" autofocus maxlength="200">
    <button type="submit" class="bouton">Se connecter</button>
  </form>
</section>
{% endblock %}
